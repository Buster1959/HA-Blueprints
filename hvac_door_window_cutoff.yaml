blueprint:
  name: HVAC Cutoff on Door/Window Open
  description: >
    Turns off an HVAC relay/actuator when any door or window sensor in a room
    stays open longer than a grace period (so brief in/out doesn't cut power),
    and turns it back on immediately once all sensors are closed again.
    Sensors that go unavailable/unknown are ignored for the closed check and
    raise a persistent notification until they recover.
  domain: automation
  source_url: https://github.com/your-repo/hvac-cutoff-blueprint
  input:
    room_name:
      name: Room Name
      description: Friendly name used in notifications/logbook (e.g. "Lounge")
      selector:
        text:

    door_window_sensors:
      name: Door/Window Sensors
      description: One or more binary_sensor entities (device_class door/window)
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - door
            - window
          multiple: true

    hvac_actuator:
      name: HVAC Actuator (High Current Relay)
      description: The switch entity controlling the HVAC unit's relay
      selector:
        entity:
          domain: switch

    open_grace_period:
      name: Open Grace Period
      description: >
        How long a sensor must stay open before HVAC is cut. Lets people walk
        in/out without triggering a cutoff.
      default: 120
      selector:
        number:
          min: 0
          max: 1800
          unit_of_measurement: seconds
          mode: box

    notify_on_trigger:
      name: Notify on Trigger (optional)
      description: Optional notify service to call when HVAC is cut (leave blank to skip)
      default: ""
      selector:
        text:

mode: restart

trigger:
  # A sensor has been open continuously for open_grace_period -> cut HVAC.
  # If it closes again before the grace period elapses, this simply never
  # fires for that entity (the timer resets automatically).
  - platform: state
    entity_id: !input door_window_sensors
    to: "on"
    for:
      seconds: !input open_grace_period
    id: opened_and_settled
  # Any sensor just closed -> re-check the whole group immediately.
  - platform: state
    entity_id: !input door_window_sensors
    to: "off"
    id: closed
  # A sensor dropped off (offline/removed battery/zigbee drop, etc).
  - platform: state
    entity_id: !input door_window_sensors
    to:
      - "unavailable"
      - "unknown"
    id: sensor_unavailable
  # A previously-dead sensor is reporting again.
  - platform: state
    entity_id: !input door_window_sensors
    from:
      - "unavailable"
      - "unknown"
    id: sensor_recovered

condition: []

variables:
  sensors: !input door_window_sensors

action:
  # A sensor stayed open past the grace period -> cut HVAC.
  - if:
      - condition: trigger
        id: opened_and_settled
    then:
      - service: switch.turn_off
        target:
          entity_id: !input hvac_actuator
      - if:
          - condition: template
            value_template: "{{ notify_on_trigger != '' }}"
        then:
          - service: "{{ notify_on_trigger }}"
            data:
              message: >
                {{ room_name }}: door/window left open — HVAC cut.

  # A sensor just closed, OR a sensor went unavailable (fail-open: better to
  # heat/cool an empty room than leave HVAC off indefinitely because a
  # sensor died and nobody's on-site to notice). Either way, if no sensor
  # currently reads "on" — unavailable/unknown ones are ignored, not treated
  # as open or closed — restore HVAC immediately, no delay.
  - if:
      - condition: or
        conditions:
          - condition: trigger
            id: closed
          - condition: trigger
            id: sensor_unavailable
      - condition: template
        value_template: >
          {{ expand(sensors) | selectattr('state', 'eq', 'on') | list | length == 0 }}
    then:
      - service: switch.turn_on
        target:
          entity_id: !input hvac_actuator
      - if:
          - condition: template
            value_template: "{{ notify_on_trigger != '' }}"
        then:
          - service: "{{ notify_on_trigger }}"
            data:
              message: >
                {{ room_name }}: all doors/windows closed (or sensor lost) —
                HVAC restored.

  # A sensor went unavailable/unknown -> flag it so it doesn't silently get
  # ignored forever, even though HVAC fails open around it.
  - if:
      - condition: trigger
        id: sensor_unavailable
    then:
      - service: persistent_notification.create
        data:
          notification_id: "hvac_cutoff_dead_sensor_{{ trigger.entity_id }}"
          title: "HVAC Cutoff: dead sensor ({{ room_name }})"
          message: >
            {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}
            is now {{ trigger.to_state.state }}. It's being ignored for the
            HVAC cutoff/restore logic (HVAC defaults ON when unsure) until it
            reports on/off again.

  # A dead sensor came back -> clear its notification.
  - if:
      - condition: trigger
        id: sensor_recovered
    then:
      - service: persistent_notification.dismiss
        data:
          notification_id: "hvac_cutoff_dead_sensor_{{ trigger.entity_id }}"
