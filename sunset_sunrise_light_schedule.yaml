blueprint:
  name: Sunset/Sunrise Bounded Light Schedule
  description: >
    Turns the selected lights or switches on at sunset when sunset occurs
    before the evening cutoff, then turns them off at the cutoff.

    In the morning, turns them on at the configured start time only when
    the sun is still below the horizon, then turns them off at sunrise.
  domain: automation

  input:
    light_target:
      name: Lights or switches
      description: Select the entities controlled by this schedule.
      selector:
        target:
          entity:
            domain:
              - light
              - switch

    evening_off_time:
      name: Evening cutoff
      description: Time at which the entities turn off in the evening.
      default: "23:00:00"
      selector:
        time:

    morning_on_time:
      name: Morning start
      description: Time at which the entities turn on if it is still dark.
      default: "07:00:00"
      selector:
        time:

mode: single

trigger:
  - platform: sun
    event: sunset
    id: sunset

  - platform: time
    at: !input evening_off_time
    id: evening_cutoff

  - platform: time
    at: !input morning_on_time
    id: morning_start

  - platform: sun
    event: sunrise
    id: sunrise

condition: []

action:
  - choose:
      # Turn on at sunset only when sunset occurs before the cutoff.
      - conditions:
          - condition: trigger
            id: sunset
          - condition: time
            before: !input evening_off_time
        sequence:
          - action: homeassistant.turn_on
            target: !input light_target

      # Always turn off at the evening cutoff.
      - conditions:
          - condition: trigger
            id: evening_cutoff
        sequence:
          - action: homeassistant.turn_off
            target: !input light_target

      # Turn on at the morning start time only when the sun is still down.
      - conditions:
          - condition: trigger
            id: morning_start
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - action: homeassistant.turn_on
            target: !input light_target

      # Always turn off at sunrise.
      - conditions:
          - condition: trigger
            id: sunrise
        sequence:
          - action: homeassistant.turn_off
            target: !input light_target
